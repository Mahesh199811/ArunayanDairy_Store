server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
  products:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
